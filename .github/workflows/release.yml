name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_monitor/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust to PATH
        run: echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Sync version from tag
        run: node scripts/sync-version.cjs --from-tag ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri:build

      - name: Locate NSIS installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/PIU_*_x64-setup.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $exe) {
            Write-Error 'NSIS installer (PIU_*_x64-setup.exe) was not produced by tauri:build'
            exit 1
          }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIU-windows-x64-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PIU ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.installer.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
