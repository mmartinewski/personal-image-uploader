name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go_monitor/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust to PATH
        run: echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Sync version from tag
        run: node scripts/sync-version.cjs --from-tag ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIU-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/PIU_*_x64-setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PIU ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/PIU_*_x64-setup.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
